<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Colorful abstract illustration of a convex hull, a discrete point lattice, and a colored graph, representing convex geometry, discrete geometry, and combinatorics">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#1e50c2"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06d6a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06d6a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- soft color glows for extra vibrancy -->
  <circle cx="260" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="1200" cy="380" r="300" fill="url(#glow2)"/>
  <circle cx="900" cy="80" r="240" fill="url(#glow3)"/>
  <circle cx="1450" cy="120" r="200" fill="url(#glow1)"/>

  <!-- discrete mesh / combinatorial graph edges -->
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5">
    <line x1="220" y1="160" x2="380" y2="90"/>
    <line x1="380" y1="90" x2="500" y2="260"/>
    <line x1="500" y1="260" x2="220" y2="160"/>
    <line x1="500" y1="260" x2="350" y2="250"/>
    <line x1="350" y1="250" x2="220" y2="160"/>
    <line x1="350" y1="250" x2="280" y2="430"/>
    <line x1="500" y1="260" x2="460" y2="400"/>
    <line x1="460" y1="400" x2="280" y2="430"/>
    <line x1="380" y1="90" x2="560" y2="140"/>
    <line x1="560" y1="140" x2="700" y2="80"/>
    <line x1="560" y1="140" x2="500" y2="260"/>
    <line x1="560" y1="140" x2="750" y2="250"/>
    <line x1="700" y1="80" x2="880" y2="180"/>
    <line x1="700" y1="80" x2="750" y2="250"/>
    <line x1="750" y1="250" x2="880" y2="180"/>
    <line x1="750" y1="250" x2="640" y2="430"/>
    <line x1="640" y1="430" x2="460" y2="400"/>
    <line x1="750" y1="250" x2="820" y2="400"/>
    <line x1="820" y1="400" x2="640" y2="430"/>
    <line x1="880" y1="180" x2="1020" y2="110"/>
    <line x1="880" y1="180" x2="950" y2="290"/>
    <line x1="950" y1="290" x2="750" y2="250"/>
    <line x1="950" y1="290" x2="820" y2="400"/>
    <line x1="1020" y1="110" x2="1180" y2="200"/>
    <line x1="1020" y1="110" x2="950" y2="290"/>
    <line x1="1180" y1="200" x2="950" y2="290"/>
    <line x1="1180" y1="200" x2="1150" y2="300"/>
    <line x1="950" y1="290" x2="1150" y2="300"/>
    <line x1="1150" y1="300" x2="1000" y2="440"/>
    <line x1="1000" y1="440" x2="820" y2="400"/>
    <line x1="1180" y1="200" x2="1320" y2="140"/>
    <line x1="1320" y1="140" x2="1460" y2="260"/>
    <line x1="1460" y1="260" x2="1150" y2="300"/>
    <line x1="1460" y1="260" x2="1380" y2="430"/>
    <line x1="1380" y1="430" x2="1200" y2="380"/>
    <line x1="1200" y1="380" x2="1150" y2="300"/>
    <line x1="1200" y1="380" x2="1000" y2="440"/>
  </g>

  <!-- convex hull outline -->
  <polygon points="150,300 220,160 380,90 700,80 1020,110 1320,140 1460,260 1500,400 1380,430 1200,380 1000,440 820,400 640,430 460,400 280,430 150,300"
    fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- lattice / discrete points, colored like a proper graph coloring -->
  <g stroke="#0f2f66" stroke-width="1.5">
    <circle cx="150" cy="300" r="7" fill="#ff6ec7"/>
    <circle cx="220" cy="160" r="6" fill="#ffffff"/>
    <circle cx="380" cy="90" r="7" fill="#ffd166"/>
    <circle cx="700" cy="80" r="7" fill="#06d6a0"/>
    <circle cx="1020" cy="110" r="7" fill="#06d6a0"/>
    <circle cx="1320" cy="140" r="7" fill="#ff6ec7"/>
    <circle cx="1460" cy="260" r="7" fill="#ef476f"/>
    <circle cx="1500" cy="400" r="6" fill="#ffffff"/>
    <circle cx="1380" cy="430" r="7" fill="#ffd166"/>
    <circle cx="1200" cy="380" r="7" fill="#ffd166"/>
    <circle cx="1000" cy="440" r="7" fill="#118ab2"/>
    <circle cx="820" cy="400" r="7" fill="#06d6a0"/>
    <circle cx="640" cy="430" r="7" fill="#ff6ec7"/>
    <circle cx="460" cy="400" r="7" fill="#ef476f"/>
    <circle cx="280" cy="430" r="6" fill="#ffffff"/>
    <circle cx="560" cy="140" r="7" fill="#118ab2"/>
    <circle cx="880" cy="180" r="6" fill="#ffffff"/>
    <circle cx="1180" cy="200" r="7" fill="#ef476f"/>
    <circle cx="500" cy="260" r="5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="750" cy="250" r="5" fill="#ffd166"/>
    <circle cx="950" cy="290" r="5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="1150" cy="300" r="5" fill="#06d6a0"/>
    <circle cx="350" cy="250" r="5" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
